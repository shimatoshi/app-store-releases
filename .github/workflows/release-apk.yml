name: Build and publish Store APK
on:
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
    secrets:
      STORE_SIGNING_KEYSTORE_BASE64:
        required: true
      STORE_KEYSTORE_PASSWORD:
        required: false
      STORE_KEY_PASSWORD:
        required: false
      STORE_KEY_ALIAS:
        required: false
permissions:
  contents: write
concurrency:
  group: store-apk-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: shimatoshi/app-store-releases
          ref: main
          path: .store-ci
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.9'
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'platforms;android-35' 'build-tools;35.0.0'
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
      - name: Build versioned APK
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 .store-ci/scripts/build_apk.py --version "$RELEASE_VERSION"
      - name: Sign with persistent owner key
        env:
          STORE_SIGNING_KEYSTORE_BASE64: ${{ secrets.STORE_SIGNING_KEYSTORE_BASE64 }}
          STORE_KEYSTORE_PASSWORD: ${{ secrets.STORE_KEYSTORE_PASSWORD }}
          STORE_KEY_PASSWORD: ${{ secrets.STORE_KEY_PASSWORD }}
          STORE_KEY_ALIAS: ${{ secrets.STORE_KEY_ALIAS }}
          APK_PATH: ${{ steps.build.outputs.apk }}
        run: python3 .store-ci/scripts/sign_apk.py "$APK_PATH"
      - name: Publish immutable versioned Release and metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.build.outputs.version }}
        run: python3 .store-ci/scripts/store_release.py publish --version "$RELEASE_VERSION" --apk store-signed.apk
